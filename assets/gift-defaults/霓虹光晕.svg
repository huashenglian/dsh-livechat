<!-- dsh-livechat bundled gift effect "霓虹光晕" (neon halo) — self-drawn, MIT. 512x512, ~2.8s one-shot. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="gdzne-core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e0f2fe"/>
      <stop offset="55%" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .gdzne-ring{transform-box:view-box;transform-origin:50% 50%;fill:none;animation:gdzne-pulse 2.8s ease-out 1 both;}
    .gdzne-core{transform-box:view-box;transform-origin:50% 50%;animation:gdzne-core 2.8s ease-in-out 1 both;}
    @keyframes gdzne-pulse{0%{transform:scale(.35);opacity:0;}25%{opacity:.9;}100%{transform:scale(1.55);opacity:0;}}
    @keyframes gdzne-core{0%{transform:scale(.3) rotate(0deg);opacity:0;}30%{transform:scale(1.05) rotate(40deg);opacity:1;}70%{opacity:.95;}100%{transform:scale(1.25) rotate(140deg);opacity:0;}}
  </style>
  <g style="filter:hue-rotate(0deg)">
    <circle class="gdzne-ring" style="animation-delay:0s" cx="256" cy="256" r="200" stroke="#38bdf8" stroke-width="10"/>
    <circle class="gdzne-ring" style="animation-delay:.35s" cx="256" cy="256" r="200" stroke="#a78bfa" stroke-width="10"/>
    <circle class="gdzne-ring" style="animation-delay:.7s" cx="256" cy="256" r="200" stroke="#f472b6" stroke-width="10"/>
    <circle class="gdzne-core" cx="256" cy="256" r="190" fill="url(#gdzne-core)"/>
    <circle class="gdzne-core" style="animation-delay:.15s" cx="256" cy="256" r="96" fill="#bae6fd" opacity=".85"/>
    <circle class="gdzne-core" style="animation-delay:.3s" cx="256" cy="256" r="46" fill="#ffffff"/>
  </g>
</svg>
